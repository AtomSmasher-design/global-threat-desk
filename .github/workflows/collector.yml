name: Live collector

# Reads the official and news sources that phone browsers cannot read directly,
# and publishes the replies to the `live` branch for the desk to read.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect sources
        run: node collector/collect.mjs out
      - name: Publish to the live branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b live
          git config user.name "threat-desk-collector"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
      - name: Keep the schedule alive
        # GitHub pauses scheduled jobs in a public repository after 60 days without commits.
        if: github.event_name == 'schedule'
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $((50*86400)) ]; then
            git config user.name "threat-desk-collector"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q --allow-empty -m "Keep the live collector schedule active"
            git push -q origin HEAD:main
          fi
